<!doctype html>
<html lang="km">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ដំឡើង Linecheck</title>
<meta name="description" content="របៀបដាក់ Linecheck នៅលើអេក្រង់ទូរស័ព្ទ iPhone និង Android">
<meta name="theme-color" content="#0B1220">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;600;700&family=Barlow+Condensed:wght@700;800&display=swap">
<style>
:root{--bg:#0B1220;--card:#131d33;--line:#26324f;--ink:#e8edf6;--muted:#9aa7bd;--acc:#F5A623;--good:#4CC38A;--phone:#0f1729;--scr:#1a2540}
@media (prefers-color-scheme:light){:root{--bg:#f4f6fa;--card:#fff;--line:#d8deea;--ink:#14213d;--muted:#5a6780;--acc:#b0650a;--good:#1E7A3E;--phone:#1d2433;--scr:#eef2f8}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 "Kantumruy Pro","Noto Sans Khmer","Khmer OS",system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:max(20px,env(safe-area-inset-top)) 16px 48px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.top img{width:52px;height:52px;border-radius:12px}
.brand{font:800 34px/1 "Barlow Condensed",Arial Narrow,Arial,sans-serif;letter-spacing:.01em}.brand span{color:var(--acc)}
h1{font-size:1.35rem;margin:14px 0 4px;line-height:1.4}
.sub{color:var(--muted);margin:0 0 16px}
.link{display:flex;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:18px}
.link code{flex:1;min-width:0;font:600 .9rem ui-monospace,Menlo,monospace;color:var(--acc);overflow-wrap:anywhere}
.btn{font:600 .9rem "Kantumruy Pro",system-ui,sans-serif;background:var(--acc);color:#14110a;border:0;border-radius:10px;padding:9px 14px;cursor:pointer;white-space:nowrap;text-decoration:none;display:inline-block}
.btn.ghost{background:none;color:var(--acc);border:1px solid var(--acc)}
.lang{margin-left:auto;display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}.lang button{font:600 .8rem "Kantumruy Pro",system-ui,sans-serif;padding:6px 12px;border:0;background:none;color:var(--muted);cursor:pointer}.lang button[aria-pressed=true]{background:var(--acc);color:#14110a}
html[lang=en] body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.55}
.tabs{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:0 0 16px;position:sticky;top:8px;z-index:3;background:var(--card)}
.tabs button{font:600 1rem "Kantumruy Pro",system-ui,sans-serif;padding:12px 6px;border:0;background:none;color:var(--muted);cursor:pointer}
.tabs button[aria-pressed=true]{background:var(--acc);color:#14110a}
.step{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;display:grid;grid-template-columns:1fr 132px;gap:12px;align-items:center}
.step .n{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;background:var(--acc);color:#14110a;font-weight:700;margin-bottom:4px}
.step p{margin:0}.step b{color:var(--ink)}
.step svg{width:132px;height:auto;display:block}
.tip{border-left:3px solid var(--acc);background:var(--card);border-radius:10px;padding:10px 12px;margin:14px 0;color:var(--ink)}
.tip strong{color:var(--acc)}
h2{font-size:1.1rem;margin:24px 0 8px}
ul{padding-left:20px;margin:6px 0}li{margin:4px 0}
.done{text-align:center;margin:22px 0 6px}
footer{color:var(--muted);font-size:.8rem;text-align:center;margin-top:28px;line-height:1.6}
[hidden]{display:none!important}
@media (max-width:380px){.step{grid-template-columns:1fr 110px}.step svg{width:110px}}
</style>
</head>
<body>
<main>
  <div class="top"><img src="icon-192.png" alt=""><div class="brand">LINE<span>CHECK</span></div><div class="lang" role="group" aria-label="Language"><button type="button" data-lang="km">ខ្មែរ</button><button type="button" data-lang="en">English</button></div></div>
  <h1 data-i="h1"></h1>
  <p class="sub" data-i="sub"></p>

  <div class="link"><code id="url">https://pisethhour333.github.io/linecheck/</code><button class="btn" id="copy" type="button" data-i="copy"></button></div>

  <div class="tabs" role="tablist"><button type="button" data-os="ios" aria-pressed="true">📱 iPhone</button><button type="button" data-os="and" aria-pressed="false">🤖 Android</button></div>

  <section id="ios"></section>
  <section id="and" hidden></section>

  <h2 data-i="notesH"></h2>
  <ul data-i="notes"></ul>

  <div class="done"><a class="btn" href="./" id="open" data-i="open"></a></div>

  <footer><span data-i="foot"></span><br><a href="privacy.html" style="color:inherit">Privacy policy</a> · <a href="terms.html" style="color:inherit">Terms of use</a></footer>
</main>
<script>

  s:phone(urlbar(20)+lines(48,9)+bar(204,24,"var(--card)")+shareIco(66,217)+ring(66,216,10)+hand(70,222))},

  s:phone(bar(12,216,"#000",.35)+`<rect x="12" y="92" width="108" height="132" rx="10" fill="var(--card)"/>`+[0,1,2,3].map(i=>`<rect x="18" y="${100+i*30}" width="96" height="24" rx="6" fill="${i===2?"rgba(245,166,35,.18)":"var(--scr)"}" ${i===2?`stroke="${A}" stroke-width="2"`:""}/>`).join("")+txt(24,115,"Copy",7.5)+txt(24,145,"Add to Reading List",7.5)+txt(24,175,"Add to Home Screen",7.5,"var(--ink)",700)+`<g stroke="var(--ink)" stroke-width="1.2" fill="none"><rect x="100" y="167" width="9" height="9" rx="2"/><path d="M104.5 169 v5 M102 171.5 h5"/></g>`+txt(24,205,"Add Bookmark",7.5)+hand(88,178))},

 {t:{km:`រួចរាល់! រូបតំណាង <b>Linecheck</b> នៅលើអេក្រង់ទូរស័ព្ទ។ ចុចលើវាដើម្បីបើកដូចកម្មវិធីធម្មតា។`,en:`Done! The <b>Linecheck</b> icon is on your home screen. Tap it to open Linecheck like any other app.`},

];

 {t:{km:`បើកកម្មវិធី <b>Chrome</b> ហើយចូលទៅតំណភ្ជាប់ខាងលើ។ រង់ចាំឲ្យទំព័របើករួចរាល់។`,en:`Open <b>Chrome</b> and go to the link above. Wait for the page to finish loading.`},
  s:phone(urlbar(20)+txt(120,30,"⋮",11,"var(--ink)",700,"end")+lines(48,12))},
 {t:{km:`ចុចសញ្ញា <b>ចំណុចបី ⋮</b> នៅជ្រុងខាងលើស្តាំនៃអេក្រង់។`,en:`Tap the <b>three dots ⋮</b> in the top right corner of the screen.`},
  s:phone(urlbar(20)+txt(120,30,"⋮",11,"var(--ink)",700,"end")+ring(117,27,9)+lines(48,12)+hand(112,32))},
 {t:{km:`ចុច <b>"Install app"</b> (ដំឡើងកម្មវិធី) ឬ <b>"Add to Home screen"</b> (បន្ថែមទៅអេក្រង់ដើម)។`,en:`Tap <b>"Install app"</b> or <b>"Add to Home screen"</b>.`},
  s:phone(lines(30,14)+`<rect x="46" y="22" width="76" height="132" rx="6" fill="var(--card)" stroke="var(--line)"/>`+["New tab","History","Downloads","Install app","Settings"].map((s,i)=>(i===3?`<rect x="49" y="${26+i*25}" width="70" height="20" rx="4" fill="rgba(245,166,35,.18)" stroke="${A}" stroke-width="2"/>`:"")+txt(54,40+i*25,s,7.5,"var(--ink)",i===3?700:400)).join("")+hand(100,108))},

 {t:{km:`រួចរាល់! រូបតំណាង <b>Linecheck</b> លេចឡើងលើអេក្រង់ទូរស័ព្ទ ឬក្នុងបញ្ជីកម្មវិធី។ ចុចលើវាដើម្បីបើក។`,en:`Done! The <b>Linecheck</b> icon appears on your home screen or in your app list. Tap it to open.`},

const TIPS={ios:{km:`<div class="tip"><strong>🔔 ការជូនដំណឹងពេលសំបុត្រឈ្នះ៖</strong> នៅលើ iPhone ការជូនដំណឹងដំណើរការតែពេលអ្នកបើក Linecheck ពី<b>រូបតំណាងនៅលើអេក្រង់ដើម</b>ប៉ុណ្ណោះ (មិនមែនពី Safari ទេ)។ បើកពីរូបតំណាង ចូលទៅផ្ទាំង <b>Live</b> ចុច <b>"Notify me when closed"</b> រួចចុច <b>Allow</b> (អនុញ្ញាត)។ ត្រូវការ iOS 16.4 ឬថ្មីជាងនេះ។</div>`,
  en:`<div class="tip"><strong>🔔 Ticket won alerts:</strong> on iPhone, alerts only work when you open Linecheck from its <b>home screen icon</b> (not from Safari). Open it from the icon, go to the <b>Live</b> tab, tap <b>"Notify me when closed"</b>, then tap <b>Allow</b>. Needs iOS 16.4 or newer.</div>`},
 and:{km:`<div class="tip"><strong>💡 ប្រើ Samsung Internet?</strong> ចុចសញ្ញា <b>☰</b> (បន្ទាត់បី) នៅខាងក្រោម រួចចុច <b>"Add page to"</b> ហើយជ្រើសរើស <b>"Home screen"</b>។</div><div class="tip"><strong>🔔 ការជូនដំណឹងពេលសំបុត្រឈ្នះ៖</strong> បើក Linecheck ចូលទៅផ្ទាំង <b>Live</b> ចុច <b>"Notify me when closed"</b> ហើយចុច <b>Allow</b> (អនុញ្ញាត)។</div>`,
  en:`<div class="tip"><strong>💡 Using Samsung Internet?</strong> Tap the <b>☰</b> menu (three lines) at the bottom, tap <b>"Add page to"</b>, then choose <b>"Home screen"</b>.</div><div class="tip"><strong>🔔 Ticket won alerts:</strong> open Linecheck, go to the <b>Live</b> tab, tap <b>"Notify me when closed"</b>, then tap <b>Allow</b>.</div>`}};
const TX={h1:{km:"របៀបដាក់ Linecheck នៅលើអេក្រង់ទូរស័ព្ទ",en:"How to add Linecheck to your home screen"},
 sub:{km:"ធ្វើតែម្តង ប្រើបានរហូត។ មិនចាំបាច់ទាញយកពី App Store ឬ Play Store ទេ។",en:"Do it once and it works like an app. No App Store or Play Store download needed."},
 copy:{km:"ចម្លង",en:"Copy"},copied:{km:"បានចម្លង ✓",en:"Copied ✓"},copyMenu:{km:"ចម្លងពីម៉ឺនុយ",en:"Copy from menu"},
 notesH:{km:"📌 ចំណាំសំខាន់ៗ",en:"📌 Good to know"},
 notes:{km:`<li>លើកដំបូងដែលបើក Linecheck អ្នកត្រូវបញ្ជាក់ថាអ្នក<b>មានអាយុ ២១ ឆ្នាំ ឬលើសនេះ</b></li><li>ពេលមានកំណែថ្មី Linecheck ធ្វើបច្ចុប្បន្នភាពដោយខ្លួនឯង គ្រាន់តែបិទ ហើយបើកម្តងទៀត</li><li>ចង់ប្រើលើទូរស័ព្ទច្រើនគ្រឿង? ចុចប៊ូតុង<b>រូបមនុស្ស</b>នៅខាងលើ ហើយបង្កើតគណនី (Create account) ដើម្បីរក្សាសំបុត្រ និងប្រវត្តិភ្នាល់របស់អ្នក</li>`,
   en:`<li>The first time you open Linecheck, you confirm you're <b>21 or older</b></li><li>Linecheck updates itself: when there's a new version, just close it and open it again</li><li>Using more than one phone? Tap the <b>person button</b> at the top and choose <b>Create account</b> to keep your tickets and bet tracker on every device</li>`},

let LANG="km";
const render=(id,steps)=>{document.getElementById(id).innerHTML=steps.map((s,i)=>`<div class="step"><div><span class="n">${i+1}</span><p>${s.t[LANG]}</p></div>${s.s}</div>`).join("")+TIPS[id][LANG]};
const setLang=l=>{LANG=l==="en"?"en":"km";document.documentElement.lang=LANG;document.title=TX.title[LANG];document.querySelectorAll("[data-i]").forEach(el=>{el.innerHTML=TX[el.dataset.i][LANG]});document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===LANG));render("ios",IOS);render("and",AND);try{localStorage.setItem("lc-install-lang",LANG)}catch(e){}
  try{const u=new URL(location.href);if(LANG==="en")u.searchParams.set("lang","en");else u.searchParams.delete("lang");history.replaceState(null,"",u)}catch(e){}};
document.querySelectorAll(".lang button").forEach(b=>b.addEventListener("click",()=>setLang(b.dataset.lang)));
let start="km";try{const q=new URLSearchParams(location.search).get("lang");start=q?(q==="en"?"en":"km"):(localStorage.getItem("lc-install-lang")||"km")}catch(e){}
setLang(start);
const pick=os=>{document.querySelectorAll(".tabs button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.os===os));document.getElementById("ios").hidden=os!=="ios";document.getElementById("and").hidden=os!=="and"};
document.querySelectorAll(".tabs button").forEach(b=>b.addEventListener("click",()=>pick(b.dataset.os)));
if(/android/i.test(navigator.userAgent))pick("and");
const url=document.getElementById("url").textContent;
document.getElementById("copy").addEventListener("click",e=>{const b=e.currentTarget;(navigator.clipboard?navigator.clipboard.writeText(url):Promise.reject()).then(()=>{b.textContent=TX.copied[LANG]}).catch(()=>{const r=document.createRange();r.selectNodeContents(document.getElementById("url"));const s=getSelection();s.removeAllRanges();s.addRange(r);b.textContent=TX.copyMenu[LANG]});setTimeout(()=>b.textContent=TX.copy[LANG],2500)});
})();
</script>
</body>
</html>
